name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["server/**", "schema/**", "web/**", "deploy/**", ".dockerignore", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["server/**", "schema/**", "web/**", "deploy/**", ".dockerignore", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/spacegoose02/banditbox

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # main -> :edge; v1.2.3 -> :1.2.3, :1.2 and :latest (not for pre-releases like v1.2.3-beta.1)
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="edge-${GITHUB_SHA::7}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests build amd64 only and load it to smoke-test; pushes build both arches and publish.
      - name: Build (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: banditbox:ci
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/config"
          docker run -d --name bb -p 8686:8686 -v "$RUNNER_TEMP/config:/config" banditbox:ci
          for i in $(seq 1 20); do
            if curl -fsS localhost:8686/api/v1/health; then break; fi
            sleep 1
          done
          docker logs bb
          curl -fsS localhost:8686/api/v1/health
          docker logs bb 2>&1 | grep -q setupCode
          test "$(stat -c %u:%g "$RUNNER_TEMP/config/banditbox.db")" = "99:100"

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
