name: Plugin SDK

# Publishes banditbox-plugin-sdk to GitHub Packages when a tag like sdk-v0.1.0 is pushed.
on:
  push:
    tags: ["sdk-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish
        env:
          BANDITBOX_SDK_VERSION: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export BANDITBOX_SDK_VERSION="${BANDITBOX_SDK_VERSION#sdk-v}"
          ./gradlew --no-daemon :plugin-sdk:publishReleasePublicationToGitHubPackagesRepository
